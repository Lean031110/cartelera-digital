name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  # ghcr.io + nombre del repositorio; se pasa a minúsculas en cada paso
  # (las referencias Docker deben ir en minúsculas).
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ github.event_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Verificación de §3.4: tras fusionar a main, la imagen publicada debe arrancar.
  verify:
    name: verify published image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and smoke-test the published image
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}@${{ needs.build.outputs.digest }}"
          echo "Probando $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name cartelera-verify -p 18080:8080 "$IMAGE"
          trap 'docker rm -f cartelera-verify >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18080/healthz"; then
              echo ""
              echo "Smoke test OK: healthz responde"
              exit 0
            fi
            sleep 1
          done
          echo "Smoke test FALLIDO: healthz no respondió en 30s" >&2
          exit 1
