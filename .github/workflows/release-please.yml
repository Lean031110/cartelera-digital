name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Opcional: con un PAT dedicado (secreto CARTELERA_RELEASE_TOKEN, ámbito
          # solo este repo, Contents R/W) los PR de release disparan CI; con el
          # GITHUB_TOKEN por defecto no (regla antirrecursión de GitHub).
          token: ${{ secrets.CARTELERA_RELEASE_TOKEN || github.token }}
