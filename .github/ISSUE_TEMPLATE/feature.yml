name: Feature request
description: Suggest a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who needs it and in which situation (advertising screen, restaurant…).
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should exist?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
